<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VERIOX — Wear Your Style</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f9f9f9; }
    header { background: #000; color: #fff; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { margin: 0; font-size: 22px; letter-spacing: 2px; }
    nav a { color: #fff; margin-left: 15px; text-decoration: none; font-size: 14px; }
    .container { max-width: 1000px; margin: 30px auto; padding: 0 15px; }
    .product-grid { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
    .product-card { background: #fff; border-radius: 8px; padding: 15px; width: 280px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
    .product-card img { width: 100%; height: 280px; object-fit: cover; border-radius: 6px; }
    .btn { background: #000; color: #fff; border: none; padding: 10px 15px; width: 100%; border-radius: 4px; cursor: pointer; margin-top: 10px; font-weight: bold; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: #fff; padding: 20px; border-radius: 8px; width: 90%; max-width: 400px; position: relative; }
    .close-btn { position: absolute; right: 15px; top: 10px; font-size: 20px; cursor: pointer; }
    input, textarea { width: 100%; padding: 8px; margin: 6px 0 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    .radio-group { text-align: left; margin: 10px 0; }
  </style>
</head>
<body>

  <header>
    <h1>VERIOX</h1>
    <nav>
      <a href="#">HOME</a>
      <a href="#">SHOP</a>
      <a href="#">ABOUT</a>
      <a href="#">CONTACT</a>
    </nav>
  </header>

  <div class="container">
    <h2 style="text-align:center;">VERIOX COLLECTION</h2>
    <div class="product-grid">
      
      <!-- Product Card 1 -->
      <div class="product-card">
        <img id="mainImg1" src="product-1.jpeg" alt="Essential T-Shirt">
        <h3>Essential T-Shirt</h3>
        <p>₹599</p>
        <button class="btn" onclick="openCheckout('Essential T-Shirt', 599)">BUY NOW</button>
      </div>

    </div>
  </div>

  <!-- CHECKOUT MODAL -->
  <div id="checkoutModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeCheckout()">&times;</span>
      <h3>CHECKOUT</h3>
      <p id="itemDetail" style="font-weight: bold;"></p>

      <form onsubmit="handleOrder(event)">
        <label>Full Name</label>
        <input type="text" id="custName" required placeholder="Aapka Naam">

        <label>Mobile Number</label>
        <input type="tel" id="custPhone" required placeholder="WhatsApp Number">

        <label>Delivery Address</label>
        <textarea id="custAddress" required placeholder="Poora Pata"></textarea>

        <label>Payment Method</label>
        <div class="radio-group">
          <label><input type="radio" name="payMethod" value="UPI" onclick="togglePaymentUI()" id="payUPI"> UPI (GPay / PhonePe / Paytm)</label><br>
          <label><input type="radio" name="payMethod" value="COD" onclick="togglePaymentUI()" id="payCOD" checked> Cash on Delivery (COD)</label>
        </div>

        <!-- UPI ID BOX -->
        <div id="upiBox" style="display:none; background:#f0f7ff; padding:10px; border:1px solid #b6d4fe; border-radius:5px; margin-bottom:12px; text-align:center;">
          <small>Niche di gayi UPI ID par payment karein:</small>
          <p style="margin:5px 0; color:#0d6efd; font-weight:bold;">8875021302@fam</p>
          <small style="color:#555;">(Payment karke WhatsApp par screenshot bhej dena)</small>
        </div>

        <button type="submit" class="btn" style="background:#25D366;">PLACE ORDER</button>
      </form>
    </div>
  </div>
<script>
  let selectedProduct = "VERIOX Item";
  let selectedPrice = 599;
  const MY_WHATSAPP = "916367938093";

  function openCheckout(name, price) {
    selectedProduct = name || "VERIOX T-Shirt";
    selectedPrice = price || 599;
    let detailElem = document.getElementById('itemDetail');
    if(detailElem) detailElem.innerText = selectedProduct + " — ₹" + selectedPrice;
    document.getElementById('checkoutModal').style.display = 'flex';
  }

  function closeCheckout() {
    document.getElementById('checkoutModal').style.display = 'none';
  }

  function togglePaymentUI() {
    let upiRadio = document.getElementById('payUPI');
    let upiBox = document.getElementById('upiBox');
    if (upiRadio && upiBox) {
      upiBox.style.display = upiRadio.checked ? 'block' : 'none';
    }
  }

  function handleOrder(event) {
    event.preventDefault();

    let name = document.getElementById('custName') ? document.getElementById('custName').value : '';
    let phone = document.getElementById('custPhone') ? document.getElementById('custPhone').value : '';
    let address = document.getElementById('custAddress') ? document.getElementById('custAddress').value : '';
    
    let payOption = document.querySelector('input[name="payMethod"]:checked');
    let payment = payOption ? payOption.value : 'COD';

    let msg = `*VERIOX - Naya Order*%0A%0A*Item:* ${selectedProduct}%0A*Price:* ₹${selectedPrice}%0A*Naam:* ${name}%0A*Phone:* ${phone}%0A*Address:* ${address}%0A*Payment:* ${payment}`;

    if (payment === 'UPI') {
      msg += `%0A%0A_(Note: Customer UPI se payment karke screenshot bhejega)_`;
    }

    // Direct WhatsApp redirect
    let waUrl = `https://api.whatsapp.com/send?phone=${MY_WHATSAPP}&text=${msg}`;
    window.location.href = waUrl;
  }
</script>
  
</body>
</html>
